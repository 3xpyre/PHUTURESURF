<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PHUTURE SURF • Prototype 01</title><style>*{box-sizing:border-box}body{margin:0;background:#081b23;color:#e9f6f6;font:12px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.title{position:fixed;left:15px;top:12px;text-shadow:0 2px 4px black;letter-spacing:2px}.title b{font-size:20px}.gear{position:fixed;right:15px;top:12px}.menu{display:none;position:fixed;right:12px;top:50px;background:#071a20ee;border:1px solid #668;padding:15px;border-radius:8px}.menu.on{display:block}label{display:block;margin:10px 0}button{background:#15343d;color:white;border:1px solid #789;padding:10px;border-radius:6px}.pad,.weight{position:fixed;bottom:28px;background:#ffffff20;border:2px solid #ffffff70;display:grid;place-items:center;touch-action:none}.pad{left:22px;width:116px;height:116px;border-radius:100%}.weight{right:24px;width:60px;height:145px;border-radius:35px}.pad i,.weight i{display:block;background:#c5ecec88;border-radius:50%;width:43px;height:43px}.weight i{height:22px}.foot{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px}</style><canvas id="sea"></canvas><div class="title"><b>PHUTURE SURF</b><br>PROTOTYPE 01 • CHANNEL CAMERA<br><span id="status"></span></div><button class="gear" id="gear">⚙</button><div class="menu" id="menu"><b>CONTROLS</b><label><input id="ix" type="checkbox"> Invert horizontal</label><label><input id="iy" type="checkbox"> Invert vertical</label><label>Sensitivity <span id="sv">90</span><br><input id="s" type="range" min="1" max="100" value="90"></label><button id="next">NEW WAVE</button><p>Early 2D prototype. Not Unreal gameplay.</p></div><div class="pad" id="pad"><i></i></div><div class="weight" id="weight"><i></i></div><div class="foot">LEFT: STEER • RIGHT: WEIGHT</div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,dpr,t=0,old=0,seed=1,steer=0,weight=0,v=0,p=0;function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();const wave=x=>h*(.47-.09*Math.sin(x/w*8-t*.5)-.035*Math.sin(x/w*16-t*.65+seed)-.075*Math.pow(Math.max(0,Math.sin(x/w*8-t*.5)),8)+.012*Math.sin(x/w*31+t*.9));function frame(ms){let dt=Math.min(.05,(ms-old)/1000||.016);old=ms;t+=dt;let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#152833');sky.addColorStop(.5,'#61777b');sky.addColorStop(1,'#08232d');g.fillStyle=sky;g.fillRect(0,0,w,h);g.fillStyle='#25393c';g.beginPath();g.moveTo(0,h*.44);for(let x=0;x<=w;x+=10)g.lineTo(x,h*(.4+.02*Math.sin(x*.025)));g.lineTo(w,h*.55);g.lineTo(0,h*.55);g.fill();g.beginPath();g.moveTo(0,wave(0));for(let x=0;x<=w;x+=3)g.lineTo(x,wave(x));g.lineTo(w,h);g.lineTo(0,h);g.closePath();let water=g.createLinearGradient(0,h*.3,0,h);water.addColorStop(0,'#308786');water.addColorStop(.4,'#0d4953');water.addColorStop(1,'#061820');g.fillStyle=water;g.fill();g.strokeStyle='#e4ffffba';g.lineWidth=3;g.beginPath();for(let x=0;x<=w;x+=3){if(x===0)g.moveTo(x,wave(x));else g.lineTo(x,wave(x))}g.stroke();for(let j=0;j<45;j++){let x=(Math.sin(j*34.2+seed)*4345.4%1+1)%1*w,y=h*(.5+((j*7)%31)/65);g.strokeStyle='#b6eeee22';g.beginPath();g.moveTo(x,y);g.lineTo(x+45,y);g.stroke()}v+=(steer*(.3+Number(document.getElementById('s').value)/100*2)-v*.65)*dt;p=Math.max(-1,Math.min(1,p+v*dt));let x=w*(.5+p*.22),y=wave(x)+h*.055,a=Math.atan((wave(x+5)-wave(x-5))/10)+v*.25+weight*.12;g.save();g.translate(x,y);g.rotate(a);g.fillStyle='#01090c';g.beginPath();g.ellipse(0,12,37,6,0,0,7);g.fill();g.strokeStyle='#0c1316';g.lineWidth=9;g.beginPath();g.moveTo(-9,6);g.lineTo(-13,-16);g.lineTo(-6,-32);g.moveTo(10,6);g.lineTo(15,-15);g.lineTo(7,-33);g.stroke();g.lineWidth=14;g.beginPath();g.moveTo(-5,-32);g.lineTo(9,-53);g.stroke();g.fillStyle='#aa8777';g.beginPath();g.arc(12,-65,9,0,7);g.fill();g.strokeStyle='#0b1216';g.lineWidth=6;g.beginPath();g.moveTo(5,-48);g.lineTo(-21,-36);g.moveTo(5,-48);g.lineTo(31,-36);g.stroke();g.restore();document.getElementById('status').textContent='WAVE '+seed+' • STEER '+Math.round(steer*100)+' • WEIGHT '+Math.round(weight*100);requestAnimationFrame(frame)}requestAnimationFrame(frame);gear.onclick=()=>menu.classList.toggle('on');s.oninput=()=>sv.textContent=s.value;next.onclick=()=>{seed++;p=0;v=0};function bind(id,fn){let e=document.getElementById(id);function move(ev){let r=e.getBoundingClientRect();fn(Math.max(-1,Math.min(1,2*(ev.clientX-r.left)/r.width-1)),Math.max(-1,Math.min(1,2*(ev.clientY-r.top)/r.height-1)))}e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);move(ev)};e.onpointermove=ev=>{if(e.hasPointerCapture(ev.pointerId))move(ev)};e.onpointerup=()=>fn(0,0)}bind('pad',(x,y)=>steer=x*(ix.checked?-1:1));bind('weight',(x,y)=>weight=y*(iy.checked?-1:1));
</script></html>
